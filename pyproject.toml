[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qIT_Auto_Analyser"
version = "0.1.0"
description = "An auto analyser"

[tool.setuptools.packages.find]
include = ["report_builder*", "data_sorting*", "modelling*", "qit_plotter*", "qIT_Auto_Analyser*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
